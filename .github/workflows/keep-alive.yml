name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Query journal table
        run: |
          curl -fsS --max-time 20 "https://fmnonjmbeavwaqdauptd.supabase.co/rest/v1/journal_entries?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Query lab reports table
        run: |
          curl -fsS --max-time 20 "https://fmnonjmbeavwaqdauptd.supabase.co/rest/v1/lab_reports?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
